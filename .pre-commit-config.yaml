repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        entry: gitleaks protect --staged
        language: system
        pass_filenames: false
      - id: nixfmt
        name: nixfmt (nix formatting)
        entry: nixfmt
        language: system
        files: \.nix$
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
      - id: statix
        name: statix (nix lint)
        entry: statix check
        language: system
        pass_filenames: false
      # --fail required: stock deadnix reports unused code but exits 0, so
      # without it the hook never gates.
      - id: deadnix
        name: deadnix (unused nix)
        entry: deadnix --fail
        language: system
        files: \.nix$
      - id: skills-check
        name: skills check (lock up to date)
        # Unset GIT_INDEX_FILE: `npx skills check` stages paths that break
        # write-tree when git commit points the index at a worktree index.
        entry: bash -c 'unset GIT_INDEX_FILE; npx --yes skills@latest check -p -y'
        language: system
        pass_filenames: false
