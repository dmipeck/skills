name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run conventional-pre-commit
        run: |
          git log -1 --pretty=%B > /tmp/commit-msg
          for i in 1 2 3; do
            nix develop --command pre-commit run conventional-pre-commit \
              --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg \
              && exit 0
            echo "attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          exit 1

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run gitleaks
        run: |
          git add -A
          for i in 1 2 3; do
            nix develop --command pre-commit run gitleaks --all-files && exit 0
            echo "attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          exit 1

  nixfmt:
    name: nixfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run nixfmt
        run: |
          for i in 1 2 3; do
            nix develop --command pre-commit run nixfmt --all-files && exit 0
            echo "attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          exit 1

  editorconfig-checker:
    name: editorconfig-checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run editorconfig-checker
        run: |
          for i in 1 2 3; do
            nix develop --command pre-commit run editorconfig-checker --all-files && exit 0
            echo "attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          exit 1

  statix:
    name: statix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run statix
        run: |
          for i in 1 2 3; do
            nix develop --command pre-commit run statix --all-files && exit 0
            echo "attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          exit 1

  deadnix:
    name: deadnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run deadnix
        run: |
          for i in 1 2 3; do
            nix develop --command pre-commit run deadnix --all-files && exit 0
            echo "attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          exit 1
